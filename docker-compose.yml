services:
  juejin:
    build: .
    container_name: juejin
    restart: unless-stopped
    # 直接暴露到公网（IP + HTTP 访问），后续有域名可加 Caddy/Nginx 反代 80/443
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NITRO_PORT=3000
      - HOST=0.0.0.0
      # 时区
      - TZ=Asia/Shanghai
      # JWT 密钥：必须外部注入（.env 或 shell 环境变量），缺失时 compose 直接报错
      - JWT_SECRET=${JWT_SECRET:?请在 .env 或环境变量中注入 JWT_SECRET（可用 openssl rand -hex 32 生成）}
    # SQLite 数据持久化到宿主机 ./data 目录
    volumes:
      - ./data:/app/data
    # 日志轮转，避免日志撑爆磁盘
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
