services:
  juejin:
    build: .
    container_name: juejin
    restart: unless-stopped
    # 只监听宿主机回环地址，由 Nginx 反向代理对外提供 80/443
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - NITRO_PORT=3000
      - HOST=0.0.0.0
      # 时区
      - TZ=Asia/Shanghai
    # 日志轮转，避免日志撑爆磁盘
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
