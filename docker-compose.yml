services:
  juejin:
    build: .
    container_name: juejin
    restart: unless-stopped
    # 直接暴露到公网（IP + HTTP 访问），后续有域名可加 Caddy/Nginx 反代 80/443
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NITRO_PORT=3000
      - HOST=0.0.0.0
      # 时区
      - TZ=Asia/Shanghai
      # JWT 密钥（生产环境务必修改）
      - JWT_SECRET=change-this-to-a-long-random-string
    # SQLite 数据持久化到宿主机 ./data 目录
    volumes:
      - ./data:/app/data
    # 日志轮转，避免日志撑爆磁盘
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
